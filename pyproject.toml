[project]
name = "crop-utils"
version = "0.1.0"
description = "A GUI tool for cropping images by grid or custom selection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0.0",
]

[project.scripts]
crop-utils = "crop_utils.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crop_utils"]
